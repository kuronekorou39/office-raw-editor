[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "office-raw-editor"
version = "0.2.0"
description = "A GUI application for editing Office Open XML files (Word, Excel, PowerPoint)"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]

[project.scripts]
office-raw-editor = "office_raw_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]
