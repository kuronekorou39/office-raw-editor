[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-workdir"
version = "0.1.0"
description = "A GUI application for editing .docx files"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]

[project.scripts]
docx-workdir = "docx_workdir.app:main"

[tool.setuptools.packages.find]
where = ["src"]
